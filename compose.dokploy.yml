x-build: &build
  context: .
  dockerfile: ./infra/Dockerfile
  args:
    VITE_ENV_NAME: production
    VITE_GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
    VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
  # optional, for source map uploads
  secrets:
    - SENTRY_AUTH_TOKEN
    - SENTRY_ORG
    - SENTRY_PROJECT

x-runtime-env: &runtime_env
  DATABASE_URL: ${DATABASE_URL}
  JWT_SECRET: ${JWT_SECRET}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
  VAPID_EMAIL: ${VAPID_EMAIL}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  EMAIL_FROM: ${EMAIL_FROM}
  OAUTH_PROVIDER_CONFIG: ${OAUTH_PROVIDER_CONFIG}
  TRUSTED_PROXY_HEADERS: ${TRUSTED_PROXY_HEADERS}
  TRUSTED_ORIGINS: ${TRUSTED_ORIGINS}
  FRANKFURTER_BASE_URL: ${FRANKFURTER_BASE_URL}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}

services:
  migrate:
    build:
      <<: *build
      target: builder
    working_dir: /opt/app/packages/backend
    command: ["pnpm", "prisma", "migrate", "deploy"]
    restart: "no"
    environment: *runtime_env
    networks: &networks
      - dokploy-network

  web:
    restart: unless-stopped
    depends_on: &depends_on
      migrate:
        condition: service_completed_successfully
    build: *build
    environment: *runtime_env
    networks: *networks

  worker:
    restart: unless-stopped
    depends_on: *depends_on
    build: *build
    init: true
    command:
      [
        "--enable-source-maps",
        "--no-experimental-webstorage",
        "--import",
        "./server/instrument.server.mjs",
        "./server/worker/index.mjs",
      ]
    environment: *runtime_env
    networks: *networks

secrets:
  SENTRY_AUTH_TOKEN:
    environment: SENTRY_AUTH_TOKEN
  SENTRY_ORG:
    environment: SENTRY_ORG
  SENTRY_PROJECT:
    environment: SENTRY_PROJECT

networks:
  dokploy-network:
    external: true
