name: build
on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup
      - working-directory: ./packages/backend/
        run: pnpm db:generate
      - run: pnpm build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - run: pnpm lint
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ./infra/Dockerfile
      - uses: crate-ci/typos@v1.51.1

  test-storybook:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    steps:
      - uses: actions/checkout@v7.0.1
      # https://github.com/actions/runner/issues/2033#issuecomment-1204205989
      - run: chown -R $(id -u):$(id -g) $PWD
      - uses: $/.github/actions/setup

      - run: pnpm test:storybook --coverage
        working-directory: ./packages/frontend/

      - run: pnpm build:storybook
        working-directory: ./packages/frontend/

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-storybook
          path: packages/frontend/coverage/
          if-no-files-found: error
          retention-days: 1

  test-vitest:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup
      - working-directory: ./packages/backend/
        run: pnpm db:generate

        # pull so that testcontainers doesn't have to, timing out tests.
      - run: docker compose -f compose.dev.yml pull postgres

      - run: pnpm test --coverage --reporter=default --reporter=junit --outputFile=junit.xml

      - uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-vitest
          path: coverage/
          if-no-files-found: error
          retention-days: 1

  test-playwright:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SECURE: "false"
      FRANKFURTER_BASE_URL: https://api.frankfurter.dev/
      JWT_SECRET: test-secret
      VAPID_EMAIL: "ci+test@example.com"
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    services:
      postgres:
        image: postgres:18-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    steps:
      - uses: actions/checkout@v7.0.1
      # https://github.com/actions/runner/issues/2033#issuecomment-1204205989
      - run: chown -R $(id -u):$(id -g) $PWD
      - uses: $/.github/actions/setup
      - working-directory: ./packages/backend/
        run: |
          pnpm db:generate
          pnpm prisma migrate deploy
      - working-directory: ./packages/e2e/
        run: pnpm test

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-playwright
          path: packages/e2e/coverage/
          if-no-files-found: error
          retention-days: 1

  codecov:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [test-storybook, test-vitest, test-playwright]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
      - uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
