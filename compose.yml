services:
  web:
    restart: unless-stopped
    depends_on:
      - postgres
    build:
      context: .
      dockerfile: ./infra/Dockerfile-frontend
    # TODO: centralise/autogenerate this. must contain:
    # DATABASE_URL, JWT_SECRET, VAPID_EMAIL, VAPID_PRIVATE_KEY,
    # VAPID_PUBLIC_KEY, PUBLIC_ORIGIN, SMTP_HOST, SMTP_PORT, SMTP_USER,
    # SMTP_PASSWORD, and optional SENTRY_DSN
    env_file: &env_file
      - .env.app
    environment: &environment
      FRANKFURTER_BASE_URL: https://api.frankfurter.dev/
    ports:
      - 3000:3000

  worker:
    restart: unless-stopped
    depends_on:
      - postgres
    build:
      context: .
      dockerfile: ./infra/Dockerfile-backend
    init: true
    command: ["node", "--enable-source-maps", "src/worker.ts"]
    env_file: *env_file
    environment: *environment

  postgres:
    restart: unless-stopped
    image: postgres:18-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    # must contain POSTGRES_PASSWORD
    env_file:
      - .env.postgres
    volumes:
      - postgres:/var/lib/postgresql
volumes:
  postgres:
