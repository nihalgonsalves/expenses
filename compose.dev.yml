# base file, extended either for local or devcontainer usage
name: expenses-dev
services:
  postgres:
    image: "postgres:18-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b"
    environment:
      # server
      POSTGRES_PASSWORD: postgres
      # for psql executed inside the container
      PGUSER: postgres
      PGPASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgresql:/var/lib/postgresql
      - ./infra/postgres-init.local.sql:/docker-entrypoint-initdb.d/init.sql
    expose:
      - 5432

  frankfurter:
    image: lineofflight/frankfurter:v2.6.1@sha256:ab07d75e88fc81404db541774795c8e06e938fe5aaf9fd44d7651cb72e898952

  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    expose:
      - 8025 # web
      - 1025 # smtp

volumes:
  postgresql:
